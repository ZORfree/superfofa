name: Build

# 本仓库自用的打包流水线：
#   - push tag v*      → 编译 6 个平台产物 + 在本仓库创建 Release
#   - workflow_dispatch → 手动触发；默认只编译并上传 artifact，勾选发布才创建 Release
#
# 与 release.yml 的区别：release.yml 需要 RELEASE_PAT / PUBLIC_REPO 两个 secret 才能把产物
# 发布到公开主页仓库；本工作流只用内置 GITHUB_TOKEN 发布到当前仓库，fork 出来即可直接跑。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v，如 1.4.0）。留空则使用 dev-<sha>"
        required: false
        default: ""
      publish_release:
        description: "是否创建 Release（否则只上传 Actions artifact）"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (go vet + go test + frontend build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Go vet & test
        run: |
          go vet ./internal/... ./cmd/...
          go test ./internal/...

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  build:
    name: Build ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-amd64
            runner: macos-latest
            platform: darwin/amd64
            goos: darwin
            goarch: amd64
            artifact: superfofa.app
            updater: build/bin/superfofa.app/Contents/MacOS/superfofa-updater
            archive: superfofa-macos-amd64.zip
          - label: macos-arm64
            runner: macos-latest
            platform: darwin/arm64
            goos: darwin
            goarch: arm64
            artifact: superfofa.app
            updater: build/bin/superfofa.app/Contents/MacOS/superfofa-updater
            archive: superfofa-macos-arm64.zip
          - label: windows-amd64
            runner: windows-latest
            platform: windows/amd64
            goos: windows
            goarch: amd64
            artifact: superfofa.exe
            updater: build/bin/superfofa-updater.exe
            archive: superfofa-windows-amd64.zip
          - label: windows-arm64
            runner: windows-latest
            platform: windows/arm64
            goos: windows
            goarch: arm64
            artifact: superfofa.exe
            updater: build/bin/superfofa-updater.exe
            archive: superfofa-windows-arm64.zip
          - label: linux-amd64
            runner: ubuntu-22.04
            platform: linux/amd64
            goos: linux
            goarch: amd64
            artifact: superfofa
            updater: build/bin/superfofa-updater
            archive: superfofa-linux-amd64.tar.gz
          - label: linux-arm64
            runner: ubuntu-22.04-arm
            platform: linux/arm64
            goos: linux
            goarch: arm64
            artifact: superfofa
            updater: build/bin/superfofa-updater
            archive: superfofa-linux-arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          wails build -platform ${{ matrix.platform }} -clean \
            -ldflags "-X 'myproject/internal/app.Version=${{ steps.ver.outputs.version }}'"

      - name: Build updater
        shell: bash
        run: |
          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" go build -o "${{ matrix.updater }}" ./cmd/updater

      - name: Archive (macOS)
        if: runner.os == 'macOS'
        working-directory: build/bin
        run: zip -r -y "../../${{ matrix.archive }}" "${{ matrix.artifact }}"

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        working-directory: build/bin
        shell: pwsh
        run: Compress-Archive -Path "${{ matrix.artifact }}", "superfofa-updater.exe" -DestinationPath "../../${{ matrix.archive }}" -Force

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        working-directory: build/bin
        run: tar -czf "../../${{ matrix.archive }}" "${{ matrix.artifact }}" "superfofa-updater"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          retention-days: 30

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Archive source
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          git archive --format=tar.gz --prefix="superfofa-${VERSION}/" -o "superfofa-source-${VERSION}.tar.gz" HEAD
          git archive --format=zip --prefix="superfofa-${VERSION}/" -o "superfofa-source-${VERSION}.zip" HEAD

      - name: Compute checksums
        run: sha256sum superfofa-* > checksums.txt

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "name=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            superfofa-macos-amd64.zip
            superfofa-macos-arm64.zip
            superfofa-windows-amd64.zip
            superfofa-windows-arm64.zip
            superfofa-linux-amd64.tar.gz
            superfofa-linux-arm64.tar.gz
            superfofa-source-*.tar.gz
            superfofa-source-*.zip
            checksums.txt
